name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à builder (ex: 1.2.0)'
        required: true
        default: '1.2.0'

# Permissions requises pour créer des releases GitHub
permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # BUILD WINDOWS - DÉSACTIVÉ (utiliser branche windows pour builds Windows)
  # ==========================================================================
  # build-windows:
  #   runs-on: windows-latest
  #   ... (voir branche windows)

  # ==========================================================================
  # BUILD macOS (Intel x64)
  # ==========================================================================
  build-macos-x64:
    runs-on: macos-15-intel  # Intel x64 runner (macos-13 retiré)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify architecture is x64
        run: |
          echo "Architecture: $(uname -m)"
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "ERROR: Expected x86_64 but got $(uname -m)"
            exit 1
          fi
      
      - name: Rebuild native modules for macOS x64
        run: npm rebuild
      
      - name: Generate Prisma Client for x64
        run: npx prisma generate
        env:
          PRISMA_CLI_BINARY_TARGETS: darwin
      
      - name: Build Next.js
        run: npm run build
      
      - name: Prepare Electron resources
        run: node prepare-electron-resources.js
      
      - name: Convert icon to icns
        run: |
          if [ ! -f "resources/icon.icns" ]; then
            echo "Conversion de l'icône depuis icon-256.png..."
            mkdir -p icon.iconset
            # Utiliser icon-256.png comme source
            SOURCE="resources/icon-256.png"
            sips -z 16 16 $SOURCE --out icon.iconset/icon_16x16.png 2>/dev/null || true
            sips -z 32 32 $SOURCE --out icon.iconset/icon_16x16@2x.png 2>/dev/null || true
            sips -z 32 32 $SOURCE --out icon.iconset/icon_32x32.png 2>/dev/null || true
            sips -z 64 64 $SOURCE --out icon.iconset/icon_32x32@2x.png 2>/dev/null || true
            sips -z 128 128 $SOURCE --out icon.iconset/icon_128x128.png 2>/dev/null || true
            sips -z 256 256 $SOURCE --out icon.iconset/icon_128x128@2x.png 2>/dev/null || true
            sips -z 256 256 $SOURCE --out icon.iconset/icon_256x256.png 2>/dev/null || true
            cp $SOURCE icon.iconset/icon_256x256@2x.png 2>/dev/null || true
            cp $SOURCE icon.iconset/icon_512x512.png 2>/dev/null || true
            cp $SOURCE icon.iconset/icon_512x512@2x.png 2>/dev/null || true
            iconutil -c icns icon.iconset -o resources/icon.icns || echo "Icône non convertie"
            rm -rf icon.iconset
          fi
      
      - name: Clean dist before build
        run: rm -rf dist-electron
      
      - name: Build Electron (macOS x64)
        run: npx electron-builder --mac --x64 -c electron-builder.macos.yml --publish never
        env:
          # Pas de GH_TOKEN ici - la publication est gérée par le job create-release
          # Signature macOS désactivée (pas de certificat configuré)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      
      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-build
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          retention-days: 30

  # ==========================================================================
  # BUILD macOS (Apple Silicon arm64)
  # ==========================================================================
  build-macos-arm64:
    runs-on: macos-latest  # Apple Silicon runner (M1) - macos-14 deprecated
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify architecture is arm64
        run: |
          echo "Architecture: $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: Expected arm64 but got $(uname -m)"
            exit 1
          fi
      
      - name: Rebuild native modules for macOS arm64
        run: npm rebuild
      
      - name: Generate Prisma Client for arm64
        run: npx prisma generate
        env:
          PRISMA_CLI_BINARY_TARGETS: darwin-arm64
      
      - name: Build Next.js
        run: npm run build
      
      - name: Prepare Electron resources
        run: node prepare-electron-resources.js
      
      - name: Convert icon to icns
        run: |
          if [ ! -f "resources/icon.icns" ]; then
            echo "Conversion de l'icône depuis icon-256.png..."
            mkdir -p icon.iconset
            SOURCE="resources/icon-256.png"
            sips -z 16 16 $SOURCE --out icon.iconset/icon_16x16.png 2>/dev/null || true
            sips -z 32 32 $SOURCE --out icon.iconset/icon_16x16@2x.png 2>/dev/null || true
            sips -z 32 32 $SOURCE --out icon.iconset/icon_32x32.png 2>/dev/null || true
            sips -z 64 64 $SOURCE --out icon.iconset/icon_32x32@2x.png 2>/dev/null || true
            sips -z 128 128 $SOURCE --out icon.iconset/icon_128x128.png 2>/dev/null || true
            sips -z 256 256 $SOURCE --out icon.iconset/icon_128x128@2x.png 2>/dev/null || true
            sips -z 256 256 $SOURCE --out icon.iconset/icon_256x256.png 2>/dev/null || true
            cp $SOURCE icon.iconset/icon_256x256@2x.png 2>/dev/null || true
            cp $SOURCE icon.iconset/icon_512x512.png 2>/dev/null || true
            cp $SOURCE icon.iconset/icon_512x512@2x.png 2>/dev/null || true
            iconutil -c icns icon.iconset -o resources/icon.icns || echo "Icône non convertie"
            rm -rf icon.iconset
          fi
      
      - name: Clean dist before build
        run: rm -rf dist-electron
      
      - name: Build Electron (macOS arm64)
        run: npx electron-builder --mac --arm64 -c electron-builder.macos.yml --publish never
        env:
          # Pas de GH_TOKEN ici - la publication est gérée par le job create-release
          # Signature macOS désactivée (pas de certificat configuré)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      
      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-build
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          retention-days: 30

  # ==========================================================================
  # CRÉER LA RELEASE GITHUB
  # ==========================================================================
  create-release:
    needs: [build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure of downloaded files
        run: ls -R artifacts
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-x64-build/*
            artifacts/macos-arm64-build/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
