# ============================================================================
# ELECTRON-BUILDER CONFIG DÉFINITIVE - Atelier Vélo+
# ============================================================================
# Date: 3 novembre 2025
# Méthodologie: AGILE Renforcée - Basée sur best practices DoltHub 2024
# Sources: DoltHub Blog, Nextron, electron-builder docs
# ============================================================================

appId: com.upgradedbikes.ateliervelo
productName: Atelier Velo+
copyright: Copyright © 2025 Jérôme Leyssard - Upgraded Bikes

# ============================================================================
# BUILD NATIF
# ============================================================================
# Désactiver rebuild (binaires précompilés suffisants)
# Évite erreur "Visual Studio not found" pour better-sqlite3
npmRebuild: false

# ============================================================================
# DOSSIERS
# ============================================================================
directories:
  output: dist-electron
  buildResources: resources  # ✅ BEST PRACTICE: Icône doit être dans resources/icon.ico

# Hook afterPack pour intégrer l'icône (contourne ENAMETOOLONG)
afterPack: "./electron-builder-afterpack.js"

# ============================================================================
# FICHIERS INCLUS DANS ASAR (SOLUTION ENAMETOOLONG - 7 déc 2025)
# ============================================================================
# CHANGEMENT: Inclure TOUT dans ASAR (electron/ + web/)
# RAISON: Éviter ENAMETOOLONG en réduisant fichiers hors ASAR à ~25
# AVANT: 2929 fichiers hors ASAR → 255 523 chars (7.8x limite)
# APRÈS: ~25 fichiers hors ASAR → ~2500 chars (13x sous limite)
# ============================================================================
files:
  - package.json
  - electron/**/*           # Code Electron + web/ (TOUT dans ASAR)
  - electron/web/node_modules/**/*  # EXPLICITE: Inclure node_modules de web/ (ignoré par défaut)
  - "!electron/**/*.md"
  
  # ============================================================================
  # EXCLUSIONS CRITIQUES - Modules de build inutiles en production
  # ============================================================================
  # @next/swc-* : Compilateur SWC (122 MB) - Non nécessaire en standalone
  - "!electron/web/node_modules/@next/swc-*/**/*"
  # Autres outils de build
  - "!electron/web/node_modules/typescript/**/*"
  - "!electron/web/node_modules/@types/**/*"
  - "!electron/web/node_modules/eslint*/**/*"
  - "!electron/web/node_modules/@eslint/**/*"
  
  # ============================================================================
  # INCLURE SEULEMENT les dépendances Electron nécessaires
  # ============================================================================
  # CRITIQUE: Le node_modules racine ne contient pas .prisma/client généré
  # Mais le code Electron a besoin de certains modules (dotenv, electron-log, etc.)
  # ============================================================================
  # Inclure les dépendances Electron runtime
  - node_modules/dotenv/**/*
  - node_modules/electron-log/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  # Exclure tout le reste de node_modules
  - "!node_modules/@prisma/**/*"
  - "!node_modules/.prisma/**/*"
  - "!node_modules/next/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  
  # ============================================================================
  # OPTIMISATIONS - Exclure node_modules RACINE (pas electron/web/node_modules)
  # ============================================================================
  # IMPORTANT: Utiliser des patterns spécifiques pour le node_modules racine
  # Ne PAS utiliser **/node_modules/** car ça exclut aussi electron/web/node_modules
  # ============================================================================
  
  # Exclure outils de build du node_modules RACINE
  - "!node_modules/@sentry/**/*"
  - "!node_modules/app-builder-bin/**/*"
  - "!node_modules/app-builder-lib/**/*"
  - "!node_modules/electron-builder/**/*"
  - "!node_modules/@playwright/**/*"
  - "!node_modules/playwright/**/*"
  - "!node_modules/playwright-core/**/*"
  - "!node_modules/jest/**/*"
  - "!node_modules/@jest/**/*"
  - "!node_modules/typescript/**/*"
  - "!node_modules/@types/**/*"
  - "!node_modules/eslint/**/*"
  - "!node_modules/@eslint/**/*"
  - "!node_modules/next/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  - "!node_modules/@prisma/**/*"
  - "!node_modules/.prisma/**/*"
  
  # Exclure fichiers de développement
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/__tests__/**/*"
  - "!**/__mocks__/**/*"
  - "!**/test/**/*"
  - "!**/tests/**/*"
  - "!**/*.test.js"
  - "!**/*.test.ts"
  - "!**/*.spec.js"
  - "!**/*.spec.ts"
  
  # Exclure documentation
  - "!**/examples/**/*"
  - "!**/docs/**/*"
  - "!**/documentation/**/*"
  - "!**/*.md"
  - "!**/LICENSE"
  - "!**/CHANGELOG*"
  - "!**/README*"
  
  # Exclure fichiers de configuration
  - "!**/.eslintrc*"
  - "!**/.prettierrc*"
  - "!**/tsconfig*.json"
  - "!**/jest.config*"
  - "!**/.gitignore"
  - "!**/.npmignore"

# ============================================================================
# HOOKS - POST-PACKAGING
# ============================================================================
# afterPack: Créer symlink node_modules → npm_modules
# Raison: electron-builder ne copie PAS les symlinks (bug Windows)
# afterPack: "./electron-builder-afterpack.js"

# ============================================================================
# ASAR - ACTIVÉ (Code Electron uniquement)
# ============================================================================
# CHANGEMENT 19 nov 2025: ASAR réactivé pour code Electron
# NOTE 25 nov 2024: Compression ASAR Brotli non supportée par electron-builder 26.0.12
# STRATÉGIE:
# - Code Electron (electron/**) → ASAR (sécurité + performance)
# - Web app (Next.js) → extraResources (accès filesystem requis)
# - Prisma → extraResources (binaires natifs)
# 
# RAISON:
# - Web folder nécessite accès filesystem physique (symlink npm_modules)
# - Next.js nécessite fs.readdir, fs.stat sur npm_modules
# - ASAR ne permet pas ces opérations
# - Compression ASAR : Non supportée dans cette version d'electron-builder
asar: true
asarUnpack:
  # ============================================================================
  # BINAIRES NATIFS - DOIVENT ÊTRE HORS ASAR
  # ============================================================================
  # CHANGEMENT 7 déc 2025: web/ maintenant dans ASAR
  # Les binaires .node sont automatiquement unpacked dans app.asar.unpacked/
  # ============================================================================
  
  # 1. Prisma Query Engine (binaire natif SQLite)
  - "**/web/node_modules/.prisma/client/*.node"
  - "**/web/node_modules/@prisma/client/runtime/*.node"
  
  # 2. Sharp/libvips (traitement images)
  - "**/web/node_modules/sharp/**/*.node"
  - "**/web/node_modules/@img/**/*.node"
  - "**/web/node_modules/@img/**/*.dll"
  
  # 3. Better-sqlite3 (si présent)
  - "**/node_modules/better-sqlite3/build/Release/*.node"
  
  # 4. Tous les autres binaires natifs
  # Note: @next/swc sera supprimé par afterPack hook (non nécessaire en standalone)
  - "**/*.node"
  - "**/*.dll"

# ============================================================================
# RESSOURCES HORS ASAR (MINIMAL - SOLUTION ENAMETOOLONG)
# ============================================================================
# CHANGEMENT 7 déc 2025: Réduire au STRICT MINIMUM
# AVANT: electron-resources/web/ (2929 fichiers) → ENAMETOOLONG
# APRÈS: Seulement .env.production + icon.ico (~2 fichiers)
# web/ est maintenant dans ASAR via electron/web/
# ============================================================================
extraResources:
  # 1. ENV PRODUCTION (CRITIQUE - Secrets, ne peut pas être dans ASAR)
  - from: .env.production
    to: .env.production
  
  # 2. ICÔNE APPLICATION (pour BrowserWindow en mode packagé)
  - from: resources/icon.ico
    to: icon.ico

# ============================================================================
# CONFIGURATION WINDOWS
# ============================================================================
win:
  target:
    # DIR + ZIP: Crée unpacked ET archive zip
    # NOTE: NSIS/portable désactivés car ENAMETOOLONG (ligne commande trop longue)
    # L'utilisateur peut extraire le zip et lancer l'exe directement
    - target: dir
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # MODE STANDALONE: Signature et rcedit désactivés (ENAMETOOLONG)
  # L'icône sera intégrée via rcedit post-build (voir afterPack hook)
  forceCodeSigning: false
  signAndEditExecutable: false
  
  # ✅ BEST PRACTICE ELECTRON: Configuration icône Windows
  # Format: .ico avec plusieurs tailles (16x16, 32x32, 48x48, 256x256)
  # Chemin relatif depuis buildResources (resources/)
  # electron-builder intègre automatiquement l'icône dans l'exe Windows
  # L'icône sera utilisée pour:
  # - L'exécutable dans l'explorateur Windows
  # - La barre des tâches
  # - La fenêtre de l'application (si pas définie dans BrowserWindow)
  icon: resources/icon.ico
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  # Sprint 2: Manifest longPathAware pour ASAR + @mui
  # resources/app.manifest contient <longPathAware>true</longPathAware>
  # Permet chemins >260 caractères Windows 10 1607+
  requestedExecutionLevel: asInvoker
  
  # SIGNATURE CODE AUTO-SIGNÉE (16 nov 2025)
  # DÉSACTIVÉE TEMPORAIREMENT - Problème mot de passe certificat
  # TODO: Débugger pourquoi electron-builder ne lit pas CERT_PASSWORD
  # Réduit scan Windows Defender (gain installation 20-30%)
  # Options valides electron-builder v26:
  # - cscLink: Chemin vers certificat .pfx
  # - cscKeyPassword: Mot de passe certificat
  # - signAndEditExecutable: Signer tous les exécutables
  # cscLink: "cert-selfsigned.pfx"
  # cscKeyPassword: "${env.CERT_PASSWORD}"
  # signAndEditExecutable: true

# ============================================================================
# CONFIGURATION MACOS - DÉSACTIVÉE POUR BUILD WINDOWS
# ============================================================================
# NOTE: Configuration macOS supprimée pour éviter conflits avec build Windows
# Si besoin de build macOS, créer electron-builder.macos.yml séparé
# Raison: Références à icon.icns causent erreurs signAndEditResources sur Windows

# ============================================================================
# LOCALES - Optimisation Sprint 1 (-8 MB)
# ============================================================================
# Source: https://www.electron.build/configuration/configuration#Configuration-electronLanguages
# Par défaut Electron inclut ~100 locales (am, ar, bg, etc.)
# Application française uniquement
electronLanguages: 
  - fr
  - en  # Anglais pour fallback

# ============================================================================
# NSIS INSTALLER (Windows)
# ============================================================================
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "${productName}"
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # installerHeader: resources/installer-header.bmp  # Fichier vide (0 bytes) - À créer si besoin
  deleteAppDataOnUninstall: false  # Garder les données utilisateur
  # Optimisation installation: Options valides electron-builder v26
  # - differentialPackage: false = Pas de delta updates (installation plus rapide)
  # - packElevateHelper: false = Pas d'UAC helper (réduit taille)
  # - useZip: true = Utiliser compression ZIP (évite ENAMETOOLONG avec beaucoup de fichiers)
  # Note: Option 'solid' n'existe PAS dans electron-builder (NSIS natif uniquement)
  differentialPackage: false
  packElevateHelper: false
  useZip: true  # Compression ZIP pour éviter ENAMETOOLONG

# ============================================================================
# PORTABLE (Windows)
# ============================================================================
portable:
  artifactName: "${productName}-${version}-portable.exe"

# ============================================================================
# PUBLICATION - GitHub Releases (Auto-Update)
# ============================================================================
# Doc: https://www.electron.build/configuration/publish
# Provider: GitHub Releases (gratuit, standard)
# Usage: npm run build:electron -- --publish always
publish:
  - provider: github
    owner: jeromeleyssard-pixel
    repo: atelier-velo-plus
    releaseType: release  # ou 'draft' pour releases brouillons

# ============================================================================
# COMPRESSION - STORE (Installation Rapide)
# ============================================================================
# FIX 16 nov: Changement normal → store pour installation rapide
# 
# PROBLÈME IDENTIFIÉ (PC3):
# - Installation: 11 minutes avec compression normal
# - Cause: Windows Defender + Décompression = CPU intensif
# - 63,684 fichiers décompressés = scan antivirus lent
# 
# SOLUTION: compression: store
# - Pas de compression = Fichiers copiés directement
# - Windows Defender scan plus rapide
# - Installation: 11 min → 3-4 min (-70%)
# 
# TRADE-OFF:
# - Coût: Taille installer +135 MB (145 MB → 280 MB)
# - Bénéfice: Installation 3x plus rapide
# - Verdict: EXCELLENT (UX > Taille)
# 
# SOURCES:
# - electron-builder docs: "store = fastest install"
# - Pattern apps Electron: VS Code, Slack, Discord utilisent store
# - Mémoire interne: SOLUTION-BUILD-PERFORMANCE-15NOV.md
# 
# Options disponibles:
# - store: Pas de compression (installation rapide, EXE +40%)
# - normal: Compression standard (installation lente)
# - maximum: Compression maximale (installation très lente)
compression: store

# ============================================================================
# NOTES TECHNIQUES
# ============================================================================
# 1. PRISMA + ASAR:
#    - Binaires .node ne peuvent pas s'exécuter dans ASAR
#    - Solution: extraResources vers prisma-client/
#    - electron/main.js charge Prisma depuis process.resourcesPath
#
# 2. DOSSIERS CACHÉS:
#    - Bug electron-builder #733: dotfiles ignorés
#    - Solution: Copie EXPLICITE de .next/
#
# 3. .env.production:
#    - Contient ENCRYPTION_KEY et JWT_SECRET
#    - DOIT être copié explicitement (pas dans standalone)
#
# 4. node_modules:
#    - Renommé en npm_modules par prepare-build.js
#    - Raison: electron-builder ignore node_modules dans certains cas
#    - Symlink créé au runtime par electron/main.js
#
# 5. Sécurité:
#    - Code dans ASAR = protégé
#    - Binaires unpacked = fonctionnels
#    - sandbox: false (electron/main.js) = OK pour desktop standalone
# ============================================================================
