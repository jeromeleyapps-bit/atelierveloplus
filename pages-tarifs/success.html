<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Vélo+ — Paiement confirmé</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #1a1a1a; }
    .container { max-width: 560px; margin: 80px auto; padding: 48px 24px; background: white; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    h1 { color: #1e6091; margin-bottom: 16px; }
    .status { font-size: 18px; margin: 16px 0; min-height: 60px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #1e6091; border-radius: 50%; animation: spin 1s linear infinite; margin: 24px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert { padding: 12px 16px; border-radius: 8px; margin: 16px 0; text-align: left; }
    .alert-success { background: #d1fae5; color: #065f46; }
    .alert-info { background: #dbeafe; color: #1e3a8a; }
    .alert-warning { background: #fef3c7; color: #92400e; }
    a { color: #1e6091; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Atelier Vélo+</h1>
    <div id="status" class="status"></div>
    <div id="content"></div>
    <p style="margin-top: 32px;"><a href="/">← Retour aux tarifs</a></p>
  </div>

  <script>
    const API_BASE = (window.ATELIER_API_BASE || 'https://atelier-velo-api.upgradedbikes.workers.dev').replace(/\/$/, '');
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');

    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');

    if (!sessionId) {
      statusEl.innerHTML = '<div class="alert alert-warning">Session inconnue.</div>';
    } else {
      statusEl.innerHTML = '<div class="spinner"></div><div>Vérification du paiement…</div>';
      poll(0);
    }

    function poll(attempt) {
      fetch(`${API_BASE}/billing/order-status?session_id=${encodeURIComponent(sessionId)}`)
        .then(r => r.json())
        .then(d => {
          if (d.status === 'paid') {
            statusEl.innerHTML = '';
            contentEl.innerHTML = `
              <h2>Merci, paiement confirmé.</h2>
              <p>Ta clé d'activation a été envoyée à <strong>${d.customerEmail || 'ton email'}</strong>.</p>
              <div class="alert alert-info">
                Pour activer : ouvre Atelier Vélo+ → <strong>Paramètres → Licence</strong> → onglet « Activer un code d'achat » → colle le code reçu par email.
              </div>
            `;
            return;
          }
          if (d.status === 'pending' && attempt < 30) {
            setTimeout(() => poll(attempt + 1), 2000);
            return;
          }
          if (attempt >= 30) {
            statusEl.innerHTML = `<div class="alert alert-warning">Le paiement met plus de temps que d'habitude à se confirmer. Tu recevras quand-même l'email d'activation dès que Stripe nous confirme. Pas d'inquiétude.</div>`;
          } else {
            statusEl.innerHTML = '<div class="alert alert-warning">Statut indisponible.</div>';
          }
        })
        .catch(() => {
          statusEl.innerHTML = '<div class="alert alert-warning">Erreur réseau.</div>';
        });
    }
  </script>
</body>
</html>
